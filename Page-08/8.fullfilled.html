<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blood Request Fulfilled — Blood Relay</title>
  <link rel="stylesheet" href="8.fullfilled.css">
  
</head>

<body>
  <header class="topbar">
    <button class="back" >‹</button>
    <div class="brand"><span class="brandmark">♥</span>Blood Relay</div>
    <div class="spacer"></div>
    <span class="status">Order Completed</span>
    <button class="menu" >☰</button>
  </header>

  <main class="main">
    <i class="confetti c1"></i><i class="confetti c2"></i>
    <i class="confetti c3"></i><i class="confetti c4"></i>
    <i class="confetti c5"></i><i class="confetti c6"></i><i class="confetti c7"></i>

    <i class="confetti c14"></i><i class="confetti c15"></i>
    <i class="confetti c16"></i><i class="confetti c17"></i>
    <i class="confetti c18"></i><i class="confetti c19"></i>
    <i class="confetti c20"></i><i class="confetti c21"></i>

    <div class="celebration" >✓</div>
    <h1 class="title">Blood Request Fulfilled</h1>
    <p class="subtitle">Your blood request has been successfully fulfilled.</p>

    <section class="details" aria-label="Request details">
      <div class="blood-summary">
        <span class="blood-icon">●</span>
        <div class="blood-name">B- Blood<span class="blood-units">2 Units</span></div>
      </div>
      <div class="info-list">
        <div class="info">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3" />
            <path d="M6 20v-2a6 6 0 0 1 12 0v2" />
          </svg>
          <div>
            <div class="info-label">Donor</div>
            <div class="info-value">Rahul K.</div>
          </div>
        </div>
        <div class="info">
          <svg viewBox="0 0 24 24">
            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M3 21h18M9 7h6M9 11h6M10 21v-5h4v5" />
          </svg>
          <div>
            <div class="info-label">Hospital</div>
            <div class="info-value">City Hospital</div>
          </div>
        </div>
        <div class="info">
          <svg viewBox="0 0 24 24">
            <path d="M12 3 20 6v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3Z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <div>
            <div class="info-label">Request ID</div>
            <div class="info-value">#BR10245</div>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <a href="/index.html"><button class="button primary" >Back to Home</button></a>
      <button class="button secondary">View Request Details</button>
    </div>
  </main>

  <div class="toast" id="toast" ></div>


</body>

</html>
